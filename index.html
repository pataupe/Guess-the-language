<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Language — devine la langue</title>
<meta name="description" content="Un petit jeu pour apprendre à reconnaître les langues d'Europe à partir d'une simple phrase.">
<link rel="icon" href="images/logo2.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ====================================================== BARRE DU HAUT -->
  <header class="topbar">
    <a class="brand" href="#" id="brand" data-i18n-aria="brand.aria">
      <img src="images/logo2.png" alt="Guess the Language">
    </a>

    <div class="topbar-tools">
      <div class="hud" id="hud" hidden>
        <div class="hud-item" id="hudCountItem">
          <span class="hud-label" id="hudCountLabel"></span>
          <span class="hud-value" id="hudCount"></span>
        </div>
        <div class="hud-item" id="hudLivesItem" hidden>
          <span class="hud-label" data-i18n="hud.lives"></span>
          <span class="hud-value" id="hudLives"></span>
        </div>
        <div class="hud-item">
          <span class="hud-label" data-i18n="hud.time"></span>
          <span class="hud-value tabular" id="hudTimer">0:00</span>
        </div>
        <div class="hud-item hud-score">
          <span class="hud-label" data-i18n="hud.score"></span>
          <span class="hud-value tabular" id="hudScore">0</span>
        </div>
      </div>

      <button class="locale" type="button" id="localeBtn"
              data-i18n="locale.switch" data-i18n-aria="locale.aria"></button>
    </div>
  </header>

  <main>

    <!-- ========================================================== ACCUEIL -->
    <section class="screen screen-home is-active" id="screenHome">
      <p class="eyebrow" id="homeEyebrow"></p>
      <h1 class="home-title" data-i18n="home.title"></h1>
      <p class="home-lead" data-i18n="home.lead"></p>

      <div class="picker">
        <p class="picker-label" id="diffLabel" data-i18n="picker.label"></p>
        <div class="difficulty" role="radiogroup" aria-labelledby="diffLabel">
          <button class="diff" type="button" data-diff="facile" role="radio" aria-checked="true">
            <span class="diff-name" data-i18n="diff.facile.name"></span>
            <span class="diff-desc" data-i18n="diff.facile.desc"></span>
          </button>
          <button class="diff" type="button" data-diff="difficile" role="radio" aria-checked="false">
            <span class="diff-name" data-i18n="diff.difficile.name"></span>
            <span class="diff-desc" data-i18n="diff.difficile.desc"></span>
          </button>
        </div>
      </div>

      <div class="modes">
        <button class="mode mode-daily" type="button" data-mode="quotidien">
          <span class="mode-tag" id="dailyDate"></span>
          <span class="mode-name" data-i18n="mode.quotidien.name"></span>
          <span class="mode-desc" data-i18n="mode.quotidien.desc"></span>
          <span class="mode-best" data-best="quotidien"></span>
          <span class="mode-go"><span data-i18n="mode.play"></span> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
        </button>

        <button class="mode" type="button" data-mode="libre">
          <span class="mode-tag" data-i18n="mode.libre.tag"></span>
          <span class="mode-name" data-i18n="mode.libre.name"></span>
          <span class="mode-desc" data-i18n="mode.libre.desc"></span>
          <span class="mode-best" data-best="libre"></span>
          <span class="mode-go"><span data-i18n="mode.play"></span> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
        </button>

        <button class="mode mode-survival" type="button" data-mode="survie">
          <span class="mode-tag" data-i18n="mode.survie.tag"></span>
          <span class="mode-name" data-i18n="mode.survie.name"></span>
          <span class="mode-desc" data-i18n="mode.survie.desc"></span>
          <span class="mode-best" data-best="survie"></span>
          <span class="mode-go"><span data-i18n="mode.play"></span> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
        </button>
      </div>
    </section>

    <!-- ============================================================ PARTIE -->
    <section class="screen screen-game" id="screenGame" hidden>

      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

      <article class="specimen">
        <p class="specimen-text" id="specimenText" lang="und"></p>
      </article>

      <!-- facile : 6 propositions -->
      <div class="choices" id="choices" role="group" data-i18n-aria="guess.choicesAria"></div>

      <!-- difficile : saisie libre -->
      <form class="guessbox" id="guessForm" hidden autocomplete="off">
        <div class="combo">
          <label class="sr-only" for="guessInput" data-i18n="guess.label"></label>
          <input
            type="text"
            id="guessInput"
            role="combobox"
            aria-expanded="false"
            aria-autocomplete="list"
            aria-controls="suggestions"
            spellcheck="false"
            data-i18n-placeholder="guess.placeholder">
          <ul class="suggestions" id="suggestions" role="listbox" data-i18n-aria="guess.listAria" hidden></ul>
        </div>
        <div class="guessbox-actions">
          <button type="submit" class="btn btn-primary" id="guessSubmit" data-i18n="guess.submit"></button>
          <button type="button" class="btn btn-ghost" id="guessSkip" data-i18n="guess.skip"></button>
        </div>
      </form>

      <!-- correction -->
      <div class="verdict" id="verdict" hidden>
        <div class="verdict-head">
          <span class="verdict-badge" id="verdictBadge"></span>
          <div class="verdict-id">
            <h2 class="verdict-name" id="verdictName"></h2>
            <p class="verdict-endonym" id="verdictEndonym"></p>
          </div>
          <span class="verdict-points tabular" id="verdictPoints"></span>
        </div>
        <p class="verdict-translation" id="verdictTranslation" hidden>
          <span class="verdict-translation-label" data-i18n="verdict.translation"></span>
          <span id="verdictTranslationText"></span>
        </p>
        <dl class="facts" id="verdictFacts"></dl>
        <p class="verdict-hint" id="verdictHint"></p>
        <button class="btn btn-primary btn-next" id="nextBtn"></button>
      </div>

      <p class="live sr-only" id="liveRegion" role="status" aria-live="polite"></p>
    </section>

    <!-- ========================================================= RÉSULTATS -->
    <section class="screen screen-end" id="screenEnd" hidden>
      <p class="eyebrow" id="endMode"></p>
      <h1 class="end-title" id="endTitle"></h1>

      <div class="scoreboard">
        <div class="score-main">
          <span class="score-points tabular" id="endPoints">0</span>
          <span class="score-unit" data-i18n="end.points"></span>
        </div>
        <div class="score-side">
          <div class="score-stat">
            <span class="score-stat-value tabular" id="endCorrect"></span>
            <span class="score-stat-label" id="endCorrectLabel"></span>
          </div>
          <div class="score-stat">
            <span class="score-stat-value tabular" id="endTime">0:00</span>
            <span class="score-stat-label" data-i18n="end.time"></span>
          </div>
        </div>
      </div>

      <p class="record" id="endRecord" hidden></p>

      <ol class="recap" id="recap"></ol>

      <div class="end-actions">
        <button class="btn btn-primary" id="replayBtn"></button>
        <button class="btn btn-ghost" id="homeBtn" data-i18n="action.home"></button>
        <button class="btn btn-ghost" id="shareBtn" data-i18n="action.share"></button>
      </div>
    </section>

  </main>

  <footer class="foot">
    <span>Guess the Language</span>
    <span class="foot-dot">·</span>
    <span id="footCount"></span>
  </footer>

</div>

<script src="i18n.js"></script>
<script src="languages.js"></script>
<script src="script.js"></script>
</body>
</html>
